<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Nestlo: the open-source home for AI coding agents">
  <title>Nestlo: the open-source home for AI coding agents</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2424"/>
      <stop offset="1" stop-color="#14302E"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <g transform="translate(110 70) scale(1.3)">
  
  <!-- the bird: a rounded body with a terminal prompt -->
  <g>
    <ellipse cx="120" cy="92" rx="54" ry="50" fill="#2BB5A0"/>
    <ellipse cx="104" cy="104" rx="30" ry="26" fill="#7FE3D2" opacity="0.55"/>
    <path d="M168 84 l26 -8 l-20 22 z" fill="#F2A541"/>
    <circle cx="146" cy="74" r="7" fill="#0F2A2A"/>
    <circle cx="148.5" cy="71.5" r="2.2" fill="#FFFFFF"/>
    <path d="M88 52 q10 -22 26 -10 q-14 0 -18 14 z" fill="#1E8C7C"/>
    <!-- >_ -->
    <path d="M92 92 l14 10 l-14 10" fill="none" stroke="#0F2A2A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M112 114 h18" stroke="#0F2A2A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- the nest -->
  <path d="M26 114 Q120 132 214 114 Q210 178 120 182 Q30 178 26 114 Z" fill="#C8873A"/>
  <path d="M26 114 Q120 132 214 114" fill="none" stroke="#E0A458" stroke-width="7" stroke-linecap="round"/>
  <path d="M38 134 Q120 156 202 134" fill="none" stroke="#8A5523" stroke-width="5" stroke-linecap="round"/>
  <path d="M52 156 Q120 174 188 156" fill="none" stroke="#8A5523" stroke-width="5" stroke-linecap="round"/>
  <path d="M18 108 l26 12 M222 108 l-26 12 M70 128 l18 26 M170 128 l-18 26 M118 134 l4 30" stroke="#8A5523" stroke-width="4" stroke-linecap="round"/>
</g>
  <text x="470" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" fill="#F4EFE6" letter-spacing="-3">Nestlo</text>
  <text x="474" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#7FE3D2">The open-source home for AI coding agents.</text>
  <text x="474" y="312" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="24" fill="#B9C9C6">sandboxed · budgeted · audited · persistent cloud VMs</text>
</svg>
