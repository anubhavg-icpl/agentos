name: Android

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "ci/proposed-workflows/android.yml"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

# Read-only token for every job; only the release job gets contents: write.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle/libs.versions.toml
            apps/android/**/gradle-wrapper.properties

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          # The runner image ships the Android SDK; make sure licenses are accepted and the platform is present.
          test -n "$ANDROID_HOME" || ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Core unit tests (protocol, TLS pinning, client, terminal emulator)
        working-directory: apps/android/core
        run: ./gradlew test --no-daemon --console=plain

      - name: Decode signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nestlo.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nestlo.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: building the debug APK."
          fi

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          NESTLO_VERSION_NAME: ${{ steps.version.outputs.name }}
          NESTLO_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --console=plain
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/nestlo-android.apk"
          else
            ./gradlew :app:assembleDebug --no-daemon --console=plain
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/nestlo-android.apk"
          fi
          sha256sum "$RUNNER_TEMP/nestlo-android.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nestlo.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nestlo-android.apk
          path: ${{ runner.temp }}/nestlo-android.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nestlo-android.apk
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/nestlo-android.apk "dist/nestlo-${TAG}.apk"
          # The release may already exist (created by the main release workflow); create it if not.
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Nestlo $TAG" --verify-tag
          # Stable name first so https://github.com/<repo>/releases/latest/download/nestlo-android.apk always resolves.
          gh release upload "$TAG" "dist/nestlo-android.apk" "dist/nestlo-${TAG}.apk" --clobber
