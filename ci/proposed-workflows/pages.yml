name: Website

# Publishes site/ (the landing page) to GitHub Pages on every push to main
# that changes it. Repository setting: Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/nestlo-logo.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the site's files
        run: |
          for f in index.html style.css main.js logo.svg favicon.svg og-card.png apple-touch-icon.png; do
            test -s "site/$f" || { echo "missing site/$f"; exit 1; }
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the artifact
      id-token: write   # Pages deployment token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
