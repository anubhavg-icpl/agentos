[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-services"
version = "0.4.0"
description = "AgentOS model gateway, agent daemon, orchestrator and scheduler"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["redis>=5", "cryptography>=41"]

[project.scripts]
agentos-audit = "agentos_services.audit:main"
agentos-model-gateway = "agentos_services.gateway:main"
agentos-daemon = "agentos_services.daemon:main"
agentos-dashboard = "agentos_services.dashboard:main"
agentos-fleet = "agentos_services.fleet:main"
agentos-market = "agentos_services.market:main"
agentos-mcp-bus = "agentos_services.mcp_bus:main"
agentos-gpu = "agentos_services.gpu:main"
agentos-netns = "agentos_services.netns:main"
agentos-orchestrator = "agentos_services.orchestrator:main"
agentos-task-runner = "agentos_services.taskrunner:main"
agentos-scheduler = "agentos_services.scheduler:main"
agentos-triggers = "agentos_services.triggers:main"

[tool.setuptools.packages.find]
include = ["agentos_services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
