[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-services"
version = "0.3.0"
description = "AgentOS model gateway, agent daemon, orchestrator and scheduler"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["redis>=5"]

[project.scripts]
agentos-model-gateway = "agentos_services.gateway:main"
agentos-daemon = "agentos_services.daemon:main"
agentos-orchestrator = "agentos_services.orchestrator:main"
agentos-task-runner = "agentos_services.taskrunner:main"
agentos-scheduler = "agentos_services.scheduler:main"

[tool.setuptools.packages.find]
include = ["agentos_services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
