id = "nestlo.dashboard"
name = "Nestlo"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Nestlo orchestrator tasks, factory items and budgets inside herdr, with approve and cancel for gated tasks"
platforms = ["linux"]

# Everything here runs panel.sh (shipped in this plugin, no network). It calls
# the Nestlo CLIs (nestlo-task, nestlo-factory, nestlo-budget) as the
# user running herdr and shows what those CLIs print; a CLI that is missing or
# not permitted for that user is reported in the pane instead of failing.

[[panes]]
id = "tasks"
title = "Nestlo tasks"
command = ["sh", "panel.sh", "tasks"]

[[panes]]
id = "factory"
title = "Nestlo factory"
command = ["sh", "panel.sh", "factory"]

[[panes]]
id = "budget"
title = "Nestlo budgets"
command = ["sh", "panel.sh", "budget"]

[[panes]]
id = "approve"
title = "Approve a gated task"
command = ["sh", "panel.sh", "approve"]

[[panes]]
id = "cancel"
title = "Cancel a task"
command = ["sh", "panel.sh", "cancel"]

[[actions]]
id = "tasks"
title = "Nestlo: orchestrator tasks"
contexts = ["workspace"]
command = ["sh", "panel.sh", "open", "tasks"]

[[actions]]
id = "factory"
title = "Nestlo: factory items"
contexts = ["workspace"]
command = ["sh", "panel.sh", "open", "factory"]

[[actions]]
id = "budget"
title = "Nestlo: budgets"
contexts = ["workspace"]
command = ["sh", "panel.sh", "open", "budget"]

[[actions]]
id = "approve"
title = "Nestlo: approve a gated task"
contexts = ["workspace"]
command = ["sh", "panel.sh", "open", "approve"]

[[actions]]
id = "cancel"
title = "Nestlo: cancel a task"
contexts = ["workspace"]
command = ["sh", "panel.sh", "open", "cancel"]
