name: Release

# Replacement for .github/workflows/release.yml. Adds to the existing flow:
#   - a SHA256SUMS file covering the ISO and the SBOM
#   - SLSA build provenance for the ISO (actions/attest-build-provenance)
#   - a keyless cosign signature bundle for the ISO and for SHA256SUMS
#   - a CycloneDX SBOM of the ISO system (sbomnix), attested to the ISO
# Every action is pinned to a full commit SHA; the tag is in the comment.
# Verification commands are in docs/operations.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check --no-build --all-systems
      - run: nix build -L .#services .#cli .#installer
      - run: nix build -L .#checks.x86_64-linux.e2e
      - run: nix build -L .#checks.x86_64-linux.backup

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Nestlo ${{ github.ref_name }}
          body_path: release-notes.md

  iso:
    name: Build, attest and attach the installer ISO
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write        # attach files to the release
      id-token: write        # keyless signing: GitHub OIDC token for Fulcio
      attestations: write    # store the provenance and SBOM attestations
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build the ISO
        run: |
          nix build -L .#iso-image
          cp result/iso/*.iso "nestlo-${TAG}.iso"

      - name: SBOM (CycloneDX, sbomnix)
        run: |
          # sbomnix is in the pinned nixpkgs; `nix run .#sbom` wraps it
          OUT="nestlo-${TAG}.cdx.json" nix run .#sbom -- \
            ".#nixosConfigurations.nestlo-iso.config.system.build.toplevel"
          test -s "nestlo-${TAG}.cdx.json"

      - name: Checksums
        run: sha256sum "nestlo-${TAG}.iso" "nestlo-${TAG}.cdx.json" > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nestlo-${{ github.ref_name }}.iso
            nestlo-${{ github.ref_name }}.cdx.json
            SHA256SUMS

      - name: Attest the SBOM (CycloneDX) to the ISO
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: nestlo-${{ github.ref_name }}.iso
          predicate-type: https://cyclonedx.org/bom
          predicate-path: nestlo-${{ github.ref_name }}.cdx.json

      - name: Sign with cosign (keyless)
        run: |
          cosign sign-blob --yes --bundle "nestlo-${TAG}.iso.sigstore.json" "nestlo-${TAG}.iso"
          cosign sign-blob --yes --bundle "SHA256SUMS.sigstore.json" SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            nestlo-*.iso
            nestlo-*.cdx.json
            *.sigstore.json
            SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            nestlo-*.iso
            nestlo-*.cdx.json
            *.sigstore.json
            SHA256SUMS
