name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Evaluate and unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate every flake output (both systems)
        run: nix flake check --no-build --all-systems
      - name: Build the services (runs the pytest suite) and the CLIs
        run: nix build -L .#services .#cli .#installer .#factory-droid .#cline .#continue-cli .#open-interpreter
      - name: Evaluate the full host closure
        run: nix build --dry-run .#nixosConfigurations.agentos.config.system.build.toplevel

  e2e:
    name: End-to-end VM test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Run tests/e2e.nix
        run: nix build -L .#checks.x86_64-linux.e2e
