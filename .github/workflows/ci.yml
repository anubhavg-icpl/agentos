name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token for every job (Scorecard: Token-Permissions)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Evaluate and unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Evaluate every flake output (both systems)
        run: nix flake check --no-build --all-systems
      - name: Build the services (runs the pytest suite) and the CLIs
        run: nix build -L .#services .#cli .#installer .#factory-droid .#cline .#continue-cli .#open-interpreter
      - name: Evaluate the full host closure
        run: nix build --dry-run .#nixosConfigurations.nestlo.config.system.build.toplevel

  e2e:
    name: End-to-end VM test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Run tests/e2e.nix
        run: nix build -L .#checks.x86_64-linux.e2e
